[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nexus-memory"
version = "1.0.0"
description = "Nexus — unified, durable, multi-agent memory server (MCP + REST + OpenAPI)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.109",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "redis[hiredis]>=5.0",
    "httpx>=0.27",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "python-multipart>=0.0.9",
    "pgvector>=0.3",
    "openai>=1.30",
    "fastembed>=0.5.0",
    "click>=8.1",
]

[project.optional-dependencies]
# Embedded zero-friction install: in-process worker + fakeredis (no Redis service).
embedded = ["fakeredis>=2.20", "aiosqlite>=0.20"]
# Local cross-encoder reranker (RERANKER_PROVIDER=local).
rerank = ["sentence-transformers>=3.0"]
# Tree-sitter AST symbol extraction for non-Python languages.
code = ["tree-sitter>=0.21", "tree-sitter-languages>=1.10"]
# OpenTelemetry observability (OTEL_ENABLED=true).
otel = [
    "opentelemetry-sdk>=1.25",
    "opentelemetry-api>=1.25",
    "opentelemetry-instrumentation-fastapi>=0.46b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.46b0",
    "opentelemetry-instrumentation-redis>=0.46b0",
]

[project.scripts]
nexus = "nexus.cli:main"

[tool.setuptools.packages.find]
include = ["app*", "nexus*"]
