name: Feature Request
description: Suggest an idea or enhancement for Synapse Memory
title: "[Feature]: "
labels: ["enhancement"]
assignees:
  - dylanmarriner
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a new feature! Please clearly describe the problem you're trying to solve and your proposed solution.

  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: Is your feature request related to a problem? Please describe.
      placeholder: I'm always frustrated when I have to manually prune old memories...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: A clear and concise description of what you want to happen.
      placeholder: Add a TTL (time-to-live) configuration per memory namespace that automatically expires old entries.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: What alternative solutions or workarounds have you considered?
      placeholder: I could write a cron job to delete old memories, but it would be cleaner to have it built in.
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Add any other context, examples, or screenshots about the feature request here.
      placeholder: I've seen this work well in Redis with the EXPIRE command...

  - type: checkboxes
    id: contribution
    attributes:
      label: Contribution
      description: Are you willing to help implement this feature?
      options:
        - label: I would be willing to contribute a pull request for this feature
          required: false

  - type: checkboxes
    id: terms
    attributes:
      label: Code of Conduct
      description: By submitting this issue, you agree to follow our [Code of Conduct](../../CODE_OF_CONDUCT.md)
      options:
        - label: I agree to follow this project's Code of Conduct
          required: true
