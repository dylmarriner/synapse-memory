name: Bug Report
description: File a bug report to help us improve Synapse Memory
title: "[Bug]: "
labels: ["bug", "triage"]
assignees:
  - dylanmarriner
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report! Please provide as much detail as possible to help us reproduce and fix the issue.

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: When I try to search memories with a high similarity threshold, the server returns a 500 error...
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Step-by-step instructions to reproduce the behavior.
      placeholder: |
        1. Start the server with `docker compose up`
        2. Send a POST request to `/api/v1/memories/search` with body `{"query": "test", "threshold": 1.5}`
        3. Observe the 500 Internal Server Error
      value: |
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
      placeholder: The server should return a 422 validation error or clamp the threshold value.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened? Include error messages, stack traces, or screenshots.
      placeholder: |
        HTTP 500 Internal Server Error
        Traceback (most recent call last):
          ...
    validations:
      required: true

  - type: dropdown
    id: environment
    attributes:
      label: Environment
      description: How are you running Synapse Memory?
      options:
        - Docker Compose
        - Bare metal / local Python
        - Kubernetes
        - Other
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: What version of Synapse Memory are you running? (git commit hash, tag, or image tag)
      placeholder: "v0.1.0 or main@abc1234"
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant Log Output
      description: Please copy and paste any relevant log output. This will be automatically formatted into code.
      render: shell

  - type: checkboxes
    id: terms
    attributes:
      label: Code of Conduct
      description: By submitting this issue, you agree to follow our [Code of Conduct](../../CODE_OF_CONDUCT.md)
      options:
        - label: I agree to follow this project's Code of Conduct
          required: true
